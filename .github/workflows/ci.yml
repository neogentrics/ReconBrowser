name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test & Validate Shields
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Shields Unit Tests
        run: |
          python -m unittest discover tests
      - name: Validate Configurations
        run: |
          python -c "import json; json.load(open('config/shields-config.json')); json.load(open('config/search-engines.json'))"
