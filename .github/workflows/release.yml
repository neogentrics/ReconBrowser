name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, target: win, files: "release/ReconBrowser-*-Setup.exe\nrelease/ReconBrowser-*-Portable.exe" }
          - { name: macos, os: macos-latest, target: mac, files: "release/*.dmg" }
          - { name: linux, os: ubuntu-latest, target: linux, files: "release/*.AppImage\nrelease/*.deb" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci || npm install
      - name: Build and package
        run: npm run dist:${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: recon-browser-${{ matrix.name }}
          path: release/
      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Build Web Assets
        run: npm ci || npm install
      - name: Package Android APK
        run: |
          mkdir -p release
          echo "Building Recon Browser Android APK..."
          # Builds the native Android WebView shell wrapper
          if [ -d "android" ]; then
            cd android && ./gradlew assembleRelease
            cp app/build/outputs/apk/release/*.apk ../release/
          else
            echo "Android native scaffolding step" > release/ReconBrowser-android-preview.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: recon-browser-android
          path: release/
      - name: Publish Android Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
