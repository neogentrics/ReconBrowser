<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120f24"/>
      <stop offset="50%" stop-color="#1d1838"/>
      <stop offset="100%" stop-color="#0b1a2e"/>
    </linearGradient>
    <linearGradient id="reticle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#7c3aed" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)" stroke="#7c3aed" stroke-width="8" filter="url(#glow)"/>
  
  <!-- Outer Targeting Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#reticle)" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Middle Dashed Shield Ring -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="#06b6d4" stroke-width="8" stroke-dasharray="70 20 70 20"/>
  
  <!-- Precision Crosshairs -->
  <line x1="256" y1="64" x2="256" y2="180" stroke="#a855f7" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="332" x2="256" y2="448" stroke="#a855f7" stroke-width="10" stroke-linecap="round"/>
  <line x1="64" y1="256" x2="180" y2="256" stroke="#a855f7" stroke-width="10" stroke-linecap="round"/>
  <line x1="332" y1="256" x2="448" y2="256" stroke="#a855f7" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Center Core -->
  <circle cx="256" cy="256" r="42" fill="#7c3aed"/>
  <circle cx="256" cy="256" r="16" fill="#ffffff"/>
</svg>
